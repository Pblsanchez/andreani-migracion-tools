<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prueba · interruptores de estado de la tabla (datos sintéticos)</title>
<link rel="stylesheet" href="../../portal.css?v=2.2">
<link rel="stylesheet" href="../../seguimiento/seguimiento.css?v=1.7">
<link rel="stylesheet" href="../../seguimiento/seg-e2.css?v=1.7">
</head>
<body>
<main class="principal">
  <p class="nota">Prueba de diseño con datos sintéticos (T-019, D-133). Estado de entrada: todo prendido menos «Cerrada».</p>
  <section id="seg-lista" class="seccion"></section>
</main>
<script>
(function () {
  var I = { ok: "M5 12.5l4.5 4.5L19 7.5", info: "M12 8v.5M12 11v6", alerta: "M12 7v6M12 16.5v.5" };
  var E = [["En curso", "curso", "info", 3, 1], ["En revisión", "revision", "info", 1, 1], ["Bloqueada", "bloqueada", "alerta", 0, 1], ["En pausa", "pausa", "alerta", 4, 1], ["Cerrada", "cerrada", "ok", 16, 0]];
  function pill(e) { return '<span class="estado estado--' + e[1] + '"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="' + I[e[2]] + '" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>' + e[0] + '</span>'; }
  var h = '<div class="seccion__cab"><h2 class="titulo-seccion">Tareas</h2><span class="contador">8 de 24 en la tabla</span></div>';
  h += '<div class="pills-tabla"><span class="chips-fila__label">Ver en la tabla</span><button type="button" class="chip chip--todas" aria-pressed="false">Todas<span class="n">24</span></button>';
  E.forEach(function (e) { h += '<button type="button" class="pill-estado" aria-pressed="' + (e[4] ? "true" : "false") + '"' + (e[3] ? "" : " disabled") + '>' + pill(e) + '<span class="pill-n">' + e[3] + '</span></button>'; });
  h += '</div><div class="tabla-marco"><table class="tabla"><thead><tr><th>ID</th><th>Título</th><th>Estado</th><th>Qué falta</th></tr></thead><tbody>';
  [["T-901", "Tarea de ejemplo A", 0], ["T-902", "Tarea de ejemplo B", 1], ["T-903", "Tarea de ejemplo C", 3]].forEach(function (r) {
    h += '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td><td>' + pill(E[r[2]]) + '</td><td>Texto de ejemplo</td></tr>';
  });
  document.getElementById("seg-lista").innerHTML = h + '</tbody></table></div>';
})();
</script>
</body>
</html>
